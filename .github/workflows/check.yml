name: check
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      # Sibling layout (cf. hub README): tools/check.sh compiles against
      # ../spi and ../example1. Refuses loudly when absent.
      # Actions pinned by SHA (checkout v7, setup-java v6); Dependabot keeps them fresh.
      # Siblings pin ref: main (GITHUB_TOKEN cannot resolve another repo's
      # default branch via API); the self checkout stays unpinned so PRs
      # test their own merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bridge-1710
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matou-dev/spi
          ref: main
          path: spi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matou-dev/example1
          ref: main
          path: example1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: sh bridge-1710/tools/check.sh
